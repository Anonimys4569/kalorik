name: Build Kalorik
on:
  push:
    branches: [main]
    paths: ['Kalorik.zip', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Kalorik.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web and sync
        working-directory: kalorik
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build APK
        working-directory: kalorik/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp kalorik/android/app/build/outputs/apk/debug/app-debug.apk Kalorik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalorik-Android
          path: Kalorik.apk
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Kalorik.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build web and sync
        working-directory: kalorik
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Build app without signing
        working-directory: kalorik
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Pack IPA
        run: |
          mkdir Payload
          cp -R kalorik/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Kalorik.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kalorik-iOS
          path: Kalorik.ipa
  site:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Kalorik.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web version
        working-directory: kalorik
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: Kalorik-Android
          path: _site
      - name: Assemble site
        run: |
          cp -R kalorik/site/. _site/
          mkdir -p _site/app
          cp -R kalorik/dist/. _site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
